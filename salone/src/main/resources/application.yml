spring:
  application:
    name: salone
  datasource:
    url: jdbc:postgresql://localhost:5432/salone
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET}
    scadenza-minuti: 120
  admin:
    email: admin@salone.it
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}