spring:
  application:
    name: salone
  datasource:
    url: jdbc:postgresql://localhost:5432/salone
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET}
    scadenza-minuti: 120
  admin:
    email: admin@salone.it
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}